<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 러프 메이커</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f4f0,#1b1a1a);--panel:light-dark(#ffffff,#262424);--ink:light-dark(#222,#eee);--soft:light-dark(#777,#aaa);--line:light-dark(#ddd,#3a3838);--accent:#e0607e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{padding:16px 20px 8px}
h1{margin:0;font-size:20px}
.sub{color:var(--soft);margin:2px 0 0}
main{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px;padding:12px 20px 40px}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
label{display:block;font-weight:600;margin:10px 0 4px}
textarea{width:100%;min-height:220px;font:13px/1.5 ui-monospace,monospace;padding:8px;border:1px solid var(--line);border-radius:8px;background:transparent;color:inherit}
select,button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:inherit;min-height:36px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.hint{color:var(--soft);font-size:12px}
#info{font-size:12px;color:var(--soft);margin-bottom:8px}
#canvasWrap{overflow:auto;max-height:80vh;background:light-dark(#e9e6e0,#111);border-radius:8px;padding:12px;text-align:center}
#canvasWrap svg{background:#fff;max-width:100%;height:auto}
table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
td select{min-height:28px;padding:2px 4px;font-size:12px}
</style>
</head>
<body>
<header>
<h1>웹툰 러프 메이커 <small class="hint">v0</small></h1>
<p class="sub">장면 비트를 적고 연출 리듬을 고르면, 연출 DB의 실제 5컷 패턴을 골라 세로 러프를 그립니다.</p>
</header>
<main>
<section>
<label for="beats">장면 비트 (한 줄에 한 컷)</label>
<textarea id="beats">에드가 | 복도 끝에서 걸어옴
준 | 놀라 돌아봄 "에드가?"
에드가 | 준의 손목을 잡음
준 | 얼굴이 붉어짐
에드가 | "같이 가자" 미소</textarea>
<p class="hint">형식: <code>인물 | 행동 또는 "대사"</code>. 5줄씩 한 묶음으로 패턴을 찾습니다.</p>
<div class="row">
<div><label for="dist">거리 흐름</label><select id="dist"></select></div>
<div><label for="tempo">템포</label><select id="tempo"></select></div>
<div><label for="narr">서사 형태</label><select id="narr"></select></div>
<div><label for="goal">연출 목적</label><select id="goal"></select></div>
</div>
<div class="btns">
<button class="primary" id="gen">러프 만들기</button>
<button id="next">다른 패턴</button>
<button id="svg">SVG 저장</button>
<button id="png">PNG 저장</button>
</div>
<div id="cutTable"></div>
</section>
<section>
<div id="info">패턴을 불러오는 중…</div>
<div id="canvasWrap"></div>
</section>
</main>
<script>
const W=690;const $=s=>document.querySelector(s);
const OPT={dist:['아무거나','좁혀감','넓혀감','좁혔다 넓힘','넓혔다 좁힘','교차','유지·좁게','유지·넓게'],tempo:['아무거나','빠름','보통','느림'],narr:['아무거나','끝 정점','중간 정점','정점 선행','정점 연속','무정점'],goal:['아무거나','몰입 유도','여운','감정 지속','궁금증 유발','충격 강조','긴장 고조','정보 강조','관계 대비','시점 동일시','장면 전환','시간 압축']};
const SHOTS=['설정','전경','전신','중경','클로즈업','디테일','효과 배경'];const ANGLES=['아이레벨','하이앵글','로우앵글','탑뷰'];
for(const k in OPT)$('#'+k).innerHTML=OPT[k].map(v=>`<option>${v}</option>`).join('');
let PATS=[],state={chunks:[],pick:[]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function parseBeats(){return $('#beats').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [who,...rest]=l.split('|');const act=rest.join('|').trim()||who.trim();const said=(act.match(/"([^"]+)"/)||[])[1]||'';return {who:rest.length?who.trim():'',act,said}})}
function score(p,n){let s=0;const want={dist:$('#dist').value,tempo:$('#tempo').value,narr:$('#narr').value,goal:$('#goal').value};
  for(const k in want)if(want[k]!=='아무거나')s+=p[k]===want[k]?3:-1;
  const pics=p.cuts.filter(c=>c.t==='그림').length;s-=Math.abs(pics-n)*1.5;return s}
function candidates(n){return PATS.map(p=>({p,s:score(p,n)})).sort((a,b)=>b.s-a.s).slice(0,12).map(x=>x.p)}

function generate(reset=true){const beats=parseBeats();state.chunks=[];for(let i=0;i<beats.length;i+=5)state.chunks.push(beats.slice(i,i+5));
  if(reset)state.pick=state.chunks.map(()=>0);build()}
function build(){state.panels=[];const infos=[];
  state.chunks.forEach((ch,ci)=>{const cand=candidates(ch.length);const p=cand[state.pick[ci]%cand.length];const pics=p.cuts.filter(c=>c.t==='그림');
    infos.push(`${ci+1}묶음 ← ${p.src}-${p.id} ${p.name||'(연출명 없음)'} · ${p.dist} · ${p.tempo} · ${p.narr} · ${p.goal}`);
    ch.forEach((b,i)=>{const c=pics[Math.round(i*(pics.length-1)/Math.max(1,ch.length-1))]||pics[0]||{shot:'중경',ang:'아이레벨',h:1,gap:.3,role:'전개',emo:'평온',i:1};
      state.panels.push({...b,shot:SHOTS.includes(c.shot)?c.shot:'중경',ang:ANGLES.includes(c.ang)?c.ang:'아이레벨',h:Math.max(.45,Math.min(2.2,c.h||1)),gap:Math.max(.08,Math.min(1,c.gap||.3)),role:c.role,emo:c.emo,src:`${p.src}-${p.id}`})})});
  $('#info').innerHTML=infos.map(esc).join('<br>');renderTable();render()}
function renderTable(){$('#cutTable').innerHTML='<table><tr><th>#</th><th>비트</th><th>샷</th><th>앵글</th><th>높이</th></tr>'+state.panels.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.act.slice(0,16))}</td><td><select data-i="${i}" data-k="shot">${SHOTS.map(s=>`<option${s===p.shot?' selected':''}>${s}</option>`).join('')}</select></td><td><select data-i="${i}" data-k="ang">${ANGLES.map(s=>`<option${s===p.ang?' selected':''}>${s}</option>`).join('')}</select></td><td><input data-i="${i}" data-k="h" type="number" step="0.1" min="0.4" max="3" value="${p.h}" style="width:56px"></td></tr>`).join('')+'</table>'}
$('#cutTable').addEventListener('change',e=>{const t=e.target;const i=+t.dataset.i,k=t.dataset.k;if(isNaN(i))return;state.panels[i][k]=k==='h'?+t.value:t.value;render()});

// ---------- drawing ----------
function rng(seed){let a=0;for(const c of seed)a=Math.imul(a^c.charCodeAt(0),16777619)>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawPanel(p,x,y,w,h,idx){const R=rng(p.act+idx),j=a=>(R()-.5)*a,st='#333';let o='';
  const L=(x1,y1,x2,y2,sw=2)=>`<path d="M${x1+j(2)} ${y1+j(2)}Q${(x1+x2)/2+j(4)} ${(y1+y2)/2+j(4)} ${x2+j(2)} ${y2+j(2)}" stroke="${st}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
  const C=(cx,cy,r,sw=2)=>`<ellipse cx="${cx}" cy="${cy}" rx="${r*(1+j(.08))}" ry="${r*(1+j(.08))}" stroke="${st}" stroke-width="${sw}" fill="#fff"/>`;
  const dir=R()<.5?-1:1;
  const fig=(fx,g,s,full)=>{const hr=s*.11,hy=g-s+hr,ty=hy+hr+s*.15;let f=C(fx,hy,hr,2.4)+`<circle cx="${fx+dir*hr*.45}" cy="${hy}" r="${Math.max(1.5,hr*.12)}" fill="${st}"/>`;
    f+=L(fx,hy+hr,fx,ty+s*.25,2.4)+L(fx,ty,fx-s*.17,ty+s*.2)+L(fx,ty,fx+dir*s*.2,ty+s*.08);if(full)f+=L(fx,ty+s*.25,fx-s*.1,g)+L(fx,ty+s*.25,fx+s*.1,g);return f};
  const head=(cx,cy,r)=>C(cx,cy,r,3)+`<ellipse cx="${cx+dir*r*.4}" cy="${cy}" rx="${r*.08}" ry="${r*.12}" fill="${st}"/>`+L(cx-r*.6,cy+r*.95,cx-r*.9,cy+r*1.8,3)+L(cx+r*.6,cy+r*.95,cx+r*.9,cy+r*1.8,3);
  const n=Math.max(1,(p.act.match(/,|와 |과 |둘|두 사람/g)||[]).length+1>2?2:1);
  // angle guides
  if(p.ang==='하이앵글'||p.ang==='탑뷰')o+=`<path d="M${x} ${y+h} L${x+w/2} ${y+h*.35} L${x+w} ${y+h}" stroke="#bbb" stroke-dasharray="4 6" fill="none"/>`;
  if(p.ang==='로우앵글')o+=`<path d="M${x} ${y} L${x+w/2} ${y+h*.7} L${x+w} ${y}" stroke="#bbb" stroke-dasharray="4 6" fill="none"/>`;
  const gy=y+h*.88;
  if(p.shot==='설정'){const hz=y+h*.65;o+=L(x,hz,x+w,hz);for(let i=0;i<3;i++){const bw=w*(.15+R()*.1),bx=x+w*(.1+i*.3),bh=h*(.2+R()*.25);o+=`<rect x="${bx}" y="${hz-bh}" width="${bw}" height="${bh}" stroke="${st}" stroke-width="2" fill="none"/>`}}
  else if(p.shot==='전경'){const hz=y+h*.6;o+=L(x,hz,x+w,hz,1.5);const s=h*.35;for(let i=0;i<n;i++)o+=fig(x+w*(.4+i*.15),hz+h*.2,s,true)}
  else if(p.shot==='전신'){const s=h*.75;for(let i=0;i<n;i++)o+=fig(x+w*(n===1?.5:.38+i*.24),gy,s,true)}
  else if(p.shot==='중경'){const s=h*1.15;for(let i=0;i<n;i++)o+=fig(x+w*(n===1?.5:.32+i*.36),y+h+s*.3,s,false)}
  else if(p.shot==='클로즈업'){const r=Math.min(w,h)*.4;o+=head(x+w*.5+j(w*.15),y+h*.55,r)}
  else if(p.shot==='디테일'){const r=Math.min(w,h)*.35;o+=`<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${r*1.3}" ry="${r*.8}" stroke="${st}" stroke-width="3" fill="none"/>`+C(x+w/2,y+h/2,r*.35,3)}
  else{for(let i=0;i<20;i++){const a=i/20*Math.PI*2;o+=L(x+w/2+Math.cos(a)*w*.15,y+h/2+Math.sin(a)*h*.15,x+w/2+Math.cos(a)*w,y+h/2+Math.sin(a)*h,1)}o+=head(x+w/2,y+h/2,Math.min(w,h)*.2)}
  // balloon
  if(p.said){const bw=Math.min(w*.6,40+p.said.length*13),bh=54,bx=x+w-bw-14,by=y+14;o+=`<ellipse cx="${bx+bw/2}" cy="${by+bh/2}" rx="${bw/2}" ry="${bh/2}" fill="#fff" stroke="#333" stroke-width="2"/><text x="${bx+bw/2}" y="${by+bh/2+5}" font-size="15" text-anchor="middle" fill="#222">${esc(p.said.slice(0,18))}</text>`}
  return o}
function render(){let y=40,o='';const ws=W-60;
  state.panels.forEach((p,i)=>{const h=Math.round(p.h*ws);o+=`<g><rect x="30" y="${y}" width="${ws}" height="${h}" fill="#fff" stroke="#222" stroke-width="3"/><clipPath id="c${i}"><rect x="30" y="${y}" width="${ws}" height="${h}"/></clipPath><g clip-path="url(#c${i})">${drawPanel(p,30,y,ws,h,i)}</g>`+
    `<text x="34" y="${y+h+18}" font-size="12" fill="#999">${i+1}. ${esc(p.shot)} · ${esc(p.ang)}${p.who?' · '+esc(p.who):''} — ${esc(p.act.replace(/"[^"]*"/,'').slice(0,28))}</text></g>`;
    y+=h+Math.round(p.gap*ws)+24});
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${y+20}" viewBox="0 0 ${W} ${y+20}" font-family="system-ui,sans-serif">${o}</svg>`;
  $('#canvasWrap').innerHTML=svg;state.svg=svg}
function download(name,href){const a=document.createElement('a');a.href=href;a.download=name;a.click()}
$('#gen').onclick=()=>generate(true);
$('#next').onclick=()=>{state.pick=state.pick.map(v=>v+1);build()};
$('#svg').onclick=()=>state.svg&&download('rough.svg',URL.createObjectURL(new Blob([state.svg],{type:'image/svg+xml'})));
$('#png').onclick=()=>{if(!state.svg)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0);download('rough.png',c.toDataURL('image/png'))};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(state.svg)};
fetch('patterns.json').then(r=>r.json()).then(d=>{PATS=d.patterns.filter(p=>p.cuts.some(c=>c.t==='그림'));$('#info').textContent=`패턴 ${PATS.length}개 준비됨. 리듬을 고르고 러프 만들기를 누르세요.`;generate(true)}).catch(()=>{$('#info').textContent='patterns.json을 불러오지 못했습니다. 로컬 서버(python3 -m http.server)로 여세요.'});
</script>
</body>
</html>
