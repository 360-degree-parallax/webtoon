<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>러프 메이커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light dark;
  --bg:light-dark(#ffffff,#16181c);
  --surface:light-dark(#f6f8fa,#1e2126);
  --t1:light-dark(rgba(22,29,39,.88),rgba(255,255,255,.88));
  --t2:light-dark(rgba(19,30,44,.61),rgba(255,255,255,.58));
  --t3:light-dark(rgba(19,30,44,.40),rgba(255,255,255,.36));
  --line:light-dark(rgba(2,34,76,.09),rgba(255,255,255,.10));
  --line2:light-dark(rgba(2,34,76,.16),rgba(255,255,255,.18));
  --hover:light-dark(rgba(5,39,84,.05),rgba(255,255,255,.06));
  --dark:light-dark(#333840,#e9ebee);
  --ondark:light-dark(#ffffff,#16181c);
  --blue:#2d71f7;
  --blue-soft:light-dark(#eaf1ff,#1c2a45);
  --peak:light-dark(#f33d4d,#ff6b77);
}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--t1);font:500 15px/1.6 "Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
button,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.gnb{position:sticky;top:0;z-index:20;height:56px;display:flex;align-items:center;gap:8px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.wordmark{font-size:19px;font-weight:800;letter-spacing:-.01em}
.wordmark span{font-weight:500;color:var(--t2);font-size:14px;margin-left:10px}
.gnb .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:8px;display:grid;place-items:center}
.ib:hover{background:var(--hover)}
.btn{height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);font-size:15px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.dark{background:var(--dark);border-color:transparent;color:var(--ondark)}

.page{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:48px;max-width:1280px;margin:0 auto;padding:0 40px}
.main{padding:32px 0 80px}
h1{margin:0;font-size:28px;line-height:1.4;font-weight:700;letter-spacing:-.02em}
.desc{margin:6px 0 0;font-size:15px;color:var(--t2)}
section{margin-top:28px}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px}
.sh h2{margin:0;font-size:18px;font-weight:700}
.sh span{font-size:13px;color:var(--t2)}

textarea{display:block;width:100%;min-height:168px;padding:14px 16px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);font-size:16px;font-weight:400;line-height:1.8;resize:vertical;outline:none}
textarea:focus{border-color:var(--t1)}
.under{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13px;color:var(--t2)}
.under code{font-family:inherit;font-weight:600;color:var(--t1);background:var(--surface);border-radius:6px;padding:1px 6px}
.link{font-size:13px;font-weight:600;color:var(--t2);text-decoration:underline;text-underline-offset:3px}

/* reading */
.read{border:1px solid var(--line);border-radius:8px;padding:20px}
.read+.read{margin-top:12px}
.read .chunkno{font-size:13px;font-weight:600;color:var(--blue);margin-bottom:6px}
.read .sum{font-size:17px;font-weight:600;line-height:1.55}
.kv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;margin-top:16px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kv div{background:var(--bg);padding:10px 12px}
.kv div:last-child{grid-column-end:-1}
.kv dt{font-size:12px;color:var(--t2)}
.kv dd{margin:2px 0 0;font-size:15px;font-weight:600}
.kv dd small{display:block;font-size:12px;font-weight:500;color:var(--t2);margin-top:2px;line-height:1.4}
.match{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:14px;color:var(--t2)}
.match b{color:var(--t1);font-weight:600}
.meter{flex:none;width:72px;height:6px;border-radius:3px;background:var(--surface);overflow:hidden}
.meter i{display:block;height:100%;background:var(--blue)}
.match .why{margin-left:auto}

/* cut table */
.tbl{border-top:1px solid var(--line)}
.tr{display:grid;grid-template-columns:28px minmax(0,1.6fr) 74px 92px 84px 84px 70px 44px;gap:10px;align-items:start;padding:14px 8px;margin:0 -8px;border-bottom:1px solid var(--line);border-radius:8px}
.tr.head{padding:10px 8px;font-size:12px;font-weight:600;color:var(--t2);border-radius:0}
.tr:not(.head):hover{background:var(--hover)}
.tr.on{background:var(--blue-soft)!important}
.tr .n{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;font-size:13px;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.tr.on .n{background:var(--dark);color:var(--ondark);border-color:transparent}
.beat{cursor:pointer}
.beat b{display:block;font-size:15px;font-weight:600;line-height:1.45}
.beat small{display:block;font-size:13px;color:var(--t2)}
.why{font-size:12px;color:var(--t3);line-height:1.45;margin-top:4px}
.vng{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.vng em{font-style:normal;display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 5px;border-radius:6px;background:var(--surface);font-size:12px;font-weight:700}
.vng em.P{background:var(--peak);color:#fff}
.dots{display:flex;gap:3px;margin-top:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.dots i.on{background:var(--t1)}
.dots.P i.on{background:var(--peak)}
.val{position:relative;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 8px;margin-left:-8px;border-radius:6px;font-size:14px;font-weight:600;white-space:nowrap}
.val:hover{background:var(--hover)}
.val.lock::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--blue)}
.thumb{width:44px;height:58px;border-radius:6px;object-fit:cover;object-position:top;display:block;border:1px solid var(--line);cursor:pointer;background:var(--surface)}
.thumb.empty{cursor:default}
.menu{position:absolute;z-index:40;min-width:140px;padding:6px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu button{display:flex;justify-content:space-between;gap:12px;width:100%;height:34px;padding:0 10px;border-radius:6px;font-size:14px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button[aria-checked=true]{font-weight:700}
.menu button small{color:var(--t3);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* preview */
.pv{position:sticky;top:56px;height:calc(100vh - 56px);padding:32px 0 24px;display:flex;flex-direction:column}
.pv .sh{margin-bottom:12px}
.canvas{position:relative;flex:1;overflow:auto;border-radius:8px;background:var(--surface);padding:20px 20px 96px}
.canvas svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.bar{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;height:52px;padding:0 6px;border:1px solid var(--line2);border-radius:26px;background:var(--bg);box-shadow:0 6px 20px rgba(0,0,0,.08);white-space:nowrap}
.bar .ib{border-radius:20px}
.bar .pname{padding:0 8px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.bar .sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.bar .tb{height:40px;padding:0 12px;border-radius:20px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.bar .tb:hover{background:var(--hover)}
.toast{position:fixed;left:50%;bottom:28px;z-index:50;transform:translate(-50%,8px);padding:12px 16px;border-radius:8px;background:#333840;color:#fff;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{padding:32px 0;color:var(--t2);font-size:14px}

@media(max-width:1180px){.page{grid-template-columns:minmax(0,1fr) 340px;gap:32px;padding:0 24px}.tr{grid-template-columns:28px minmax(0,1fr) 70px 86px 80px 80px 64px;}.tr>.ref{display:none}.kv{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){.page{grid-template-columns:1fr}.pv{position:relative;height:auto;padding-top:0}.canvas{max-height:80vh}}
@media(max-width:640px){.page{padding:0 16px}.gnb{padding:0 12px}.wordmark span,.gnb .btn:not(.dark){display:none}.tr.head{display:none}.tr{grid-template-columns:28px 1fr 1fr;row-gap:6px}.tr .beat{grid-column:2/-1}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="gnb">
  <span class="wordmark">ROUGH<span>웹툰 연출 러프</span></span>
  <div class="right">
    <button class="ib" id="theme" aria-label="테마 바꾸기" title="테마 바꾸기"><svg class="i" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg></button>
    <button class="btn" data-act="svg">SVG 저장</button>
    <button class="btn dark" data-act="png">PNG 저장</button>
  </div>
</header>

<div class="page">
<main class="main">
  <h1>장면만 적으면 러프가 나와요</h1>
  <p class="desc">감정·정점·연출 목적을 글에서 계산하고, 연출 DB 244묶음 중 가장 닮은 패턴으로 컷을 짜요.</p>

  <section>
    <div class="sh"><h2>장면</h2><span id="count"></span></div>
    <textarea id="beats" aria-label="장면" spellcheck="false" placeholder="에드가 | 복도 끝에서 걸어옴">에드가 | 복도 끝에서 걸어옴
준 | 놀라 돌아봄 "에드가?"
에드가 | 준의 손목을 잡음
준 | 얼굴이 붉어짐
에드가 | "같이 가자" 미소</textarea>
    <div class="under"><span>한 줄에 한 컷 · <code>인물 | 행동</code> · 대사는 <code>"따옴표"</code> · 7줄 넘으면 5줄씩 묶음</span><button class="link" data-act="clear">지우기</button></div>
  </section>

  <section>
    <div class="sh"><h2>이렇게 읽었어요</h2><span>코드표 기준 자동 판정</span></div>
    <div id="reading"></div>
  </section>

  <section>
    <div class="sh"><h2>컷</h2><span>값을 누르면 바꿀 수 있어요 · <b style="color:var(--blue)">●</b> 직접 고른 값</span></div>
    <div class="tbl" id="tbl"></div>
  </section>
</main>

<aside class="pv" aria-label="미리보기">
  <div class="sh"><h2>미리보기</h2><span id="pvsize"></span></div>
  <div class="canvas" id="canvas"><div id="preview"></div></div>
  <div class="bar">
    <button class="ib" data-act="prev" aria-label="이전 안"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <span class="pname" id="pname">—</span>
    <button class="ib" data-act="next" aria-label="다음 안"><svg class="i" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <span class="sep"></span>
    <button class="tb" data-act="png"><svg class="i" viewBox="0 0 24 24" style="width:20px;height:20px"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>저장</button>
  </div>
</aside>
</div>
<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="status"></div>

<script src="engine.js"></script>
<script>
const W=690;const $=s=>document.querySelector(s);const RE=window.RoughEngine;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CRE_BASE='references/creative/green-midnight-closeups/',GAL_BASE='references/green-midnight/';
const LEN=[['짧게',.6],['보통',1],['길게',1.5],['아주 길게',2.2]];
const lenWord=h=>h<.7?'짧게':h<1.2?'보통':h<2?'길게':'아주 길게';
const NARR={'끝 정점':'마지막 컷에서 터지는 장면','중간 정점':'가운데서 터지고 가라앉는 장면','정점 선행':'처음부터 터지고 수습하는 장면','정점 연속':'계속 몰아치는 장면','무정점':'큰 고비 없이 흐르는 장면'};
const CURVE={'상승':'감정이 점점 올라가요','하강':'감정이 점점 가라앉아요','산형':'감정이 올랐다 내려와요','골형':'가라앉았다 다시 올라요','평탄':'감정이 고르게 이어져요'};
const PART={narr:'서사 형태',curve:'감정 곡선',goal:'연출 목적',vng:'VNG 순서',count:'컷 수',trans:'컷 전환',tempo:'템포',dist:'거리 흐름',emo:'감정'};
let PATS=[],REFS=[],CUTS=null;
const locks={};              // 문장(key) → {shot, ang, h}
const state={an:[],ranks:[],pick:[],panels:[],sel:-1,svg:''};

// ---------- compute ----------
function compute(resetPick){
  state.an=RE.analyze($('#beats').value);
  if(resetPick||state.pick.length!==state.an.length)state.pick=state.an.map(()=>0);
  state.ranks=state.an.map(a=>RE.rank(a,PATS,12));
  state.panels=[];
  state.an.forEach((a,ci)=>{const r=state.ranks[ci][state.pick[ci]];if(!r)return;
    RE.layout(a,r.p).forEach(c=>{const L=locks[c.key]||{};c.auto={shot:c.shot,ang:c.ang,h:c.h};Object.assign(c,L);c.lock=L;c.chunk=ci;c.ref=RE.suggestRef(c,REFS);state.panels.push(c)})});
  if(state.sel>=state.panels.length)state.sel=-1;
  const n=state.panels.length;$('#count').textContent=n?`${n}컷 · ${state.an.length}묶음`:'';$('#pvsize').textContent=n?`${n}컷`:'';
  renderReading();renderTable();render();
  $('#pname').textContent=state.ranks.length?state.ranks.map((r,i)=>`${state.pick[i]+1}/${r.length}`).join(' · ')+'안':'—'}

// ---------- reading ----------
function renderReading(){
  if(!state.an.length){$('#reading').innerHTML='<p class="empty">장면을 적으면 여기서 판정 결과를 보여줘요.</p>';return}
  $('#reading').innerHTML=state.an.map((a,ci)=>{const r=state.ranks[ci][state.pick[ci]];const p=r?.p;
    const top=r?Object.entries(r.parts).filter(([k,v])=>v>=.99).map(([k])=>PART[k]).slice(0,4).join('·'):'';
    return `<div class="read">${state.an.length>1?`<div class="chunkno">${ci+1}묶음 · ${a.beats.length}컷</div>`:''}
    <div class="sum">${esc(NARR[a.narr])}이에요. ${esc(CURVE[a.curve])}. ${p?`${esc(a.goal)}을 노려 <b>${esc(p.name)}</b>로 짰어요.`:''}</div>
    <dl class="kv">
      <div><dt>서사 형태</dt><dd>${esc(a.narr)}<small>${esc(a.narrWhy)}</small></dd></div>
      <div><dt>연출 목적</dt><dd>${esc(a.goal)}<small>${esc(a.goalWhy)}</small></dd></div>
      <div><dt>감정 곡선</dt><dd>${esc(a.curve)}<small>${a.beats.map(b=>b.i).join(' → ')}</small></dd></div>
      <div><dt>템포</dt><dd>${esc(a.tempo)}<small>목표 거리 ${esc(a.dist)}</small></dd></div>
      <div><dt>주된 전환</dt><dd>${esc(a.trans)}<small>VNG ${esc(a.vng)}</small></dd></div>
    </dl>
    ${p?`<div class="match"><span class="meter"><i style="width:${r.pct}%"></i></span><b>${r.pct}%</b> 참고 패턴 ${esc(p.src)}-${esc(p.id)} · ${esc(p.dist)} · ${esc(p.tempo)}<span class="why">${top?`${esc(top)} 일치`:''}</span></div>`:''}</div>`}).join('')}

// ---------- table ----------
function renderTable(){
  if(!state.panels.length){$('#tbl').innerHTML='';return}
  const head=`<div class="tr head"><span></span><span>컷</span><span>구조</span><span>감정·강도</span><span>샷</span><span>앵글</span><span>길이</span><span class="ref">참고</span></div>`;
  $('#tbl').innerHTML=head+state.panels.map((c,i)=>{const P=c.vng==='P';
    const v=(f,label,why)=>`<div><button class="val${c.lock[f]!==undefined?' lock':''}" data-f="${f}" data-i="${i}" title="${esc(why)}">${esc(label)}</button><div class="why">${esc(why)}</div></div>`;
    return `<div class="tr${i===state.sel?' on':''}" data-i="${i}">
      <button class="n" data-sel="${i}" aria-label="${i+1}번 컷 선택">${i+1}</button>
      <div class="beat" data-sel="${i}"><b>${esc(c.act.replace(/["“][^"”]*["”]/,'').trim()||c.act)}</b><small>${esc([c.who,c.said&&`“${c.said}”`].filter(Boolean).join(' · '))}</small></div>
      <div><span class="vng"><em class="${c.vng}">${c.vng}</em>${esc(c.role)}</span><div class="why">${esc(state.an[c.chunk].beats.find(b=>b.key===c.key)?.roleWhy||'')}</div></div>
      <div><span style="font-size:14px;font-weight:600">${esc(c.emo)}</span><div class="dots${P?' P':''}">${[1,2,3].map(k=>`<i class="${c.i>=k?'on':''}"></i>`).join('')}</div><div class="why">${esc(state.an[c.chunk].beats.find(b=>b.key===c.key)?.emoWhy||'')}</div></div>
      ${v('shot',c.shot,c.lock.shot!==undefined?'직접 고름':c.why.shot.slice(1).join(' · ')||c.why.shot[0])}
      ${v('ang',c.ang,c.lock.ang!==undefined?'직접 고름':c.why.ang.join(' · '))}
      ${v('h',lenWord(c.h),c.lock.h!==undefined?'직접 고름':c.why.h.slice(1).join(' · ')||c.why.h[0])}
      <div class="ref">${c.ref?`<img class="thumb" data-ref="${i}" src="${c.ref.src}" alt="" title="${esc(c.ref.label)} 구도 적용" loading="lazy">`:'<span class="thumb empty"></span>'}</div>
    </div>`}).join('')}

// ---------- menu (override) ----------
let menuFor=null;
function openMenu(btn){const i=+btn.dataset.i,f=btn.dataset.f,c=state.panels[i];menuFor={i,f};
  const opts=f==='shot'?RE.SHOTS.map(s=>[s,s]):f==='ang'?RE.ANGLES.map(s=>[s,s]):LEN.map(([w,h])=>[w,h]);
  const cur=f==='h'?lenWord(c.h):c[f],auto=f==='h'?lenWord(c.auto.h):c.auto[f];
  $('#menu').innerHTML=opts.map(([l,v])=>`<button role="menuitemradio" aria-checked="${l===cur}" data-v="${v}">${esc(l)}${l===auto?'<small>자동</small>':''}</button>`).join('')+(c.lock[f]!==undefined?`<hr><button data-v="__auto">자동으로 되돌리기</button>`:'');
  const r=btn.getBoundingClientRect();const m=$('#menu');m.hidden=false;m.style.left=Math.min(innerWidth-m.offsetWidth-8,r.left+scrollX)+'px';m.style.top=(r.bottom+scrollY+4)+'px'}
function closeMenu(){$('#menu').hidden=true;menuFor=null}
$('#menu').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!menuFor)return;const mi=menuFor.i,c=state.panels[mi],f=menuFor.f;const L=locks[c.key]||(locks[c.key]={});
  if(b.dataset.v==='__auto')delete L[f];else L[f]=f==='h'?+b.dataset.v:b.dataset.v;closeMenu();state.sel=mi;compute(false)});
document.addEventListener('click',e=>{if(!e.target.closest('#menu')&&!e.target.closest('.val'))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});

$('#tbl').addEventListener('click',e=>{const v=e.target.closest('.val');if(v){e.stopPropagation();state.sel=+v.dataset.i;markSel();openMenu(v);return}
  const t=e.target.closest('[data-ref]');if(t){const c=state.panels[+t.dataset.ref];const L=locks[c.key]||(locks[c.key]={});Object.assign(L,{shot:c.ref.shot,ang:c.ref.angle,h:c.ref.h_ratio});state.sel=+t.dataset.ref;compute(false);toast(`${state.sel+1}번 컷에 ${c.ref.label} 구도를 입혔어요`);return}
  const s=e.target.closest('[data-sel]');if(s){state.sel=+s.dataset.sel;markSel();reveal()}});
function markSel(){document.querySelectorAll('.tr[data-i]').forEach(r=>r.classList.toggle('on',+r.dataset.i===state.sel));render()}
$('#preview').addEventListener('click',e=>{const g=e.target.closest('[data-p]');if(!g)return;state.sel=+g.dataset.p;markSel();document.querySelector(`.tr[data-i="${state.sel}"]`)?.scrollIntoView({block:'center',behavior:'smooth'})});
function reveal(){const g=$(`#preview [data-p="${state.sel}"]`),c=$('#canvas');if(!g)return;const gr=g.getBoundingClientRect(),cr=c.getBoundingClientRect();if(gr.top<cr.top||gr.bottom>cr.bottom-90)c.scrollBy({top:gr.top-cr.top-20,behavior:'smooth'})}

// ---------- actions ----------
let tmr;$('#beats').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(()=>compute(true),350)});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
function download(name,href){const a=document.createElement('a');a.href=href;a.download=name;a.click()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='clear'){$('#beats').value='';$('#beats').focus();compute(true)}
  else if(a==='next'||a==='prev'){state.pick=state.pick.map((v,i)=>{const n=state.ranks[i].length;return (v+(a==='next'?1:-1)+n)%n});compute(false);toast(`${state.pick[0]+1}번째로 닮은 패턴으로 바꿨어요`)}
  else if(a==='svg'&&state.svg){download('rough.svg',URL.createObjectURL(new Blob([state.svg],{type:'image/svg+xml'})));toast('SVG로 저장했어요')}
  else if(a==='png'&&state.svg){const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width*2;c.height=img.height*2;const g=c.getContext('2d');g.scale(2,2);g.fillStyle='#fff';g.fillRect(0,0,img.width,img.height);g.drawImage(img,0,0);download('rough.png',c.toDataURL('image/png'))};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(state.svg);toast('PNG로 저장했어요')}});
const THEMES=['','light','dark'];
try{const t=localStorage.getItem('rough-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#theme').onclick=()=>{const cur=document.documentElement.dataset.theme||'';const nx=THEMES[(THEMES.indexOf(cur)+1)%3];if(nx)document.documentElement.dataset.theme=nx;else delete document.documentElement.dataset.theme;try{localStorage.setItem('rough-theme',nx)}catch(_){}toast(nx===''?'시스템 테마':nx==='light'?'라이트 테마':'다크 테마')};

// ---------- drawing ----------
function rng(seed){let a=0;for(const c of seed)a=Math.imul(a^c.charCodeAt(0),16777619)>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawPanel(p,x,y,w,h,idx){const R=rng(p.act+idx),j=a=>(R()-.5)*a,st='#333';let o='';
  const L=(x1,y1,x2,y2,sw=2)=>`<path d="M${x1+j(2)} ${y1+j(2)}Q${(x1+x2)/2+j(4)} ${(y1+y2)/2+j(4)} ${x2+j(2)} ${y2+j(2)}" stroke="${st}" stroke-width="${sw}" fill="none" stroke-linecap="round"/>`;
  const C=(cx,cy,r,sw=2)=>`<ellipse cx="${cx}" cy="${cy}" rx="${r*(1+j(.08))}" ry="${r*(1+j(.08))}" stroke="${st}" stroke-width="${sw}" fill="#fff"/>`;
  const dir=R()<.5?-1:1;
  const fig=(fx,g,s,full)=>{const hr=s*.11,hy=g-s+hr,ty=hy+hr+s*.15;let f=C(fx,hy,hr,2.4)+`<circle cx="${fx+dir*hr*.45}" cy="${hy}" r="${Math.max(1.5,hr*.12)}" fill="${st}"/>`;
    f+=L(fx,hy+hr,fx,ty+s*.25,2.4)+L(fx,ty,fx-s*.17,ty+s*.2)+L(fx,ty,fx+dir*s*.2,ty+s*.08);if(full)f+=L(fx,ty+s*.25,fx-s*.1,g)+L(fx,ty+s*.25,fx+s*.1,g);return f};
  const head=(cx,cy,r)=>C(cx,cy,r,3)+`<ellipse cx="${cx+dir*r*.4}" cy="${cy}" rx="${r*.08}" ry="${r*.12}" fill="${st}"/>`+L(cx-r*.6,cy+r*.95,cx-r*.9,cy+r*1.8,3)+L(cx+r*.6,cy+r*.95,cx+r*.9,cy+r*1.8,3);
  const n=(p.act.match(/,|와 |과 |둘|두 사람/g)||[]).length?2:1;
  if(p.ang==='하이앵글'||p.ang==='탑뷰')o+=`<path d="M${x} ${y+h} L${x+w/2} ${y+h*.35} L${x+w} ${y+h}" stroke="#bbb" stroke-dasharray="4 6" fill="none"/>`;
  if(p.ang==='로우앵글')o+=`<path d="M${x} ${y} L${x+w/2} ${y+h*.7} L${x+w} ${y}" stroke="#bbb" stroke-dasharray="4 6" fill="none"/>`;
  const gy=y+h*.88;
  if(p.shot==='설정'){const hz=y+h*.65;o+=L(x,hz,x+w,hz);for(let i=0;i<3;i++){const bw=w*(.15+R()*.1),bx=x+w*(.1+i*.3),bh=h*(.2+R()*.25);o+=`<rect x="${bx}" y="${hz-bh}" width="${bw}" height="${bh}" stroke="${st}" stroke-width="2" fill="none"/>`}}
  else if(p.shot==='전경'){const hz=y+h*.6;o+=L(x,hz,x+w,hz,1.5);const s=h*.35;for(let i=0;i<n;i++)o+=fig(x+w*(.4+i*.15),hz+h*.2,s,true)}
  else if(p.shot==='전신'){const s=h*.75;for(let i=0;i<n;i++)o+=fig(x+w*(n===1?.5:.38+i*.24),gy,s,true)}
  else if(p.shot==='중경'){const s=h*1.15;for(let i=0;i<n;i++)o+=fig(x+w*(n===1?.5:.32+i*.36),y+h+s*.3,s,false)}
  else if(p.shot==='클로즈업'){const r=Math.min(w,h)*.4;o+=head(x+w*.5+j(w*.15),y+h*.55,r)}
  else if(p.shot==='디테일'){const r=Math.min(w,h)*.35;o+=`<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${r*1.3}" ry="${r*.8}" stroke="${st}" stroke-width="3" fill="none"/>`+C(x+w/2,y+h/2,r*.35,3)}
  else{for(let i=0;i<20;i++){const a=i/20*Math.PI*2;o+=L(x+w/2+Math.cos(a)*w*.15,y+h/2+Math.sin(a)*h*.15,x+w/2+Math.cos(a)*w,y+h/2+Math.sin(a)*h,1)}o+=head(x+w/2,y+h/2,Math.min(w,h)*.2)}
  if(p.said){const bw=Math.min(w*.6,48+p.said.length*16),bh=64,bx=x+w-bw-16,by=y+16;o+=`<ellipse cx="${bx+bw/2}" cy="${by+bh/2}" rx="${bw/2}" ry="${bh/2}" fill="#fff" stroke="#333" stroke-width="2"/><text x="${bx+bw/2}" y="${by+bh/2+6}" font-size="18" text-anchor="middle" fill="#222">${esc(p.said.slice(0,16))}</text>`}
  return o}
function render(){let y=40,o='';const ws=W-60;
  state.panels.forEach((p,i)=>{const h=Math.round(p.h*ws);const sel=i===state.sel;
    o+=`<g data-p="${i}"><rect x="30" y="${y}" width="${ws}" height="${h}" fill="#fff" stroke="${sel?'#2d71f7':'#222'}" stroke-width="${sel?6:3}"/><clipPath id="c${i}"><rect x="30" y="${y}" width="${ws}" height="${h}"/></clipPath><g clip-path="url(#c${i})">${drawPanel(p,30,y,ws,h,i)}</g>`+
      `<circle cx="52" cy="${y+22}" r="16" fill="${sel?'#2d71f7':'#222'}"/><text x="52" y="${y+28}" font-size="17" font-weight="700" text-anchor="middle" fill="#fff">${i+1}</text></g>`;
    y+=h+Math.round(p.gap*ws)+16});
  state.svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${y+24}" viewBox="0 0 ${W} ${y+24}" font-family="Pretendard,system-ui,sans-serif">${o}</svg>`;
  $('#preview').innerHTML=state.svg}


// ---------- data ----------
Promise.all([
  fetch('patterns.json').then(r=>r.json()),
  fetch(GAL_BASE+'index.json').then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})),
  fetch(CRE_BASE+'index.json').then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})),
]).then(([pt,gal,cre])=>{
  PATS=pt.patterns;
  REFS=[...gal.items.map(g=>({...g,kind:'color',src:GAL_BASE+g.file,label:`컬러 러프 ${g.shot}·${g.angle}`})),...cre.items.map(g=>({...g,kind:'cre',src:CRE_BASE+g.file,label:`창작 ${g.composition}`}))];
  compute(true)}).catch(()=>{$('#reading').innerHTML='<p class="empty">패턴을 불러오지 못했어요. python3 rough/serve.py 로 열어주세요.</p>'});
</script>
