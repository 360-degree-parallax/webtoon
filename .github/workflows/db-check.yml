# 연출 DB 사본·파생 파일 검사: DB 사본이나 도구를 바꾼 커밋마다
#  1) 값 검사(tools/validate_db.py)
#  2) 파생 파일(patterns.json · nai-stats.js · cuts/index.min.json)이 사본과 맞는지(다시 만들어 비교)
#  3) 엔진 테스트와 엔진 평가 요약
# 파일을 고치거나 커밋하지는 않음. 맞지 않으면 실패하고, 고치는 명령을 알려 줌.
name: db-check
on:
  push:
    paths: ['rough/db/**', 'rough/patterns.json', 'rough/nai-stats.js', 'rough/cuts/index.json', 'rough/cuts/index.min.json', 'rough/engine.js', 'tools/**', '.github/workflows/db-check.yml']
  pull_request:
    paths: ['rough/db/**', 'rough/patterns.json', 'rough/nai-stats.js', 'rough/cuts/index.json', 'rough/cuts/index.min.json', 'rough/engine.js', 'tools/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 값 검사
        run: python3 tools/validate_db.py
      - name: 파생 파일이 DB 사본과 맞는지
        run: |
          python3 tools/build_patterns.py
          python3 tools/build_nai_stats.py
          python3 tools/build_index_min.py
          if ! git diff --quiet -- rough/patterns.json rough/nai-stats.js rough/cuts/index.min.json; then
            git diff --stat -- rough/patterns.json rough/nai-stats.js rough/cuts/index.min.json
            echo "::error::파생 파일이 DB 사본과 달라요. 'python3 tools/build_patterns.py && python3 tools/build_nai_stats.py && python3 tools/build_index_min.py'를 실행해 함께 커밋해 주세요."
            exit 1
          fi
      - name: 엔진 테스트
        run: node rough/test_engine.js
      - name: 엔진 평가 요약
        run: |
          node tools/eval_engine.js --md eval.md
          sed -n '/### 전체/,/^$/p;/### 전체/,/3위 안/p' eval.md | head -16 >> "$GITHUB_STEP_SUMMARY"
