# GitHub Pages 배포: 비공개 서브모듈(cuts/) 없이 저장소 그대로 올린다.
# 주소: https://360-degree-parallax.github.io/webtoon/rough/
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: 올릴 파일만 모으기
        run: |
          mkdir -p _site
          cp -r rough docs README.md _site/
          # 도구(학습·검수 스크립트)만 쓰고 브라우저는 읽지 않는 파일은 빼서 사이트 용량을 줄임
          rm -f _site/rough/db/cut-meta.json _site/rough/db/cut-lines.json _site/rough/db/verified.json
          rm -rf _site/rough/src
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=rough/"><a href="rough/">러프 툴 열기</a>' > _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  # 업로드와 배포를 다른 작업으로 나눠야 배포 단계가 방금 올린 결과물을 안정적으로 찾는다
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
